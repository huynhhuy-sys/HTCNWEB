<!DOCTYPE html>
<html lang="en">
    <!-- Phần mở đầu -->
    <head>
        <meta charset="UTF-8">
        <title> YOKO'S KITCHEN </title>

        <style>
            *{
                box-sizing: border-box;
                margin: 0 auto;
            }

            #container{
                border: 1px solid green;
            }

            #header1{
                width: 100%;
                height: 100px;
                background-color: rgba(128, 128, 128, 0.692);
            }

            #menu_ngang{
                width: 100%;
                height: 50px;
                background-color: rgb(128, 128, 128);
            }

            #content1{
                width: 35%;
                height: 750px;
                float: left;
                background-color: brown;
            }

            #content2{
                width: 35%;
                height: 750px;
                float: left;
                background-color: greenyellow;
            }

            #content3{
                width: 30%;
                height: 750px;
                float: left;
                background-color: skyblue;
            }

            #footer{
                width: 100%;
                height: 50px;
                background-color: rgb(128, 128, 128);
                clear: both;
            }
        </style>
    </head>

    <!-- Phần thân -->
    <body>
        <div id="container">
            <div id="header1"> 
                <p> Đây là phần header1 </p>
            </div>
            <div id="menu_ngang"> 
                <p> Đây là menu ngang </p>
            </div>
            <div id="content1"> 
                <p> Đây là nội dung 1 </p>
            </div>
            <div id="content2"> 
                <p> Đây là nội dung 2 </p>
            </div>
            <div id="content3"> 
                <p> Đây là nội dung 3 </p>
            </div>
            <div id="footer"> 
                <p> Đây là footer </p>
            </div>
        </div>
    </body>
</html>
