<!-- Tạo layout -->

<!DOCTYPE html> <!-- Báo đang sử dụng trang html -->

<html> <!-- Thẻ bao hết tất cả cấu trúc-->
    
<!-- Phần mở đầu -->
    <head> <!-- Chứa thẻ meta, css, -->
        <meta charset="UTF-8">
        <meta name="viewport">
        <title> CafeMenu </title> 
        <!-- Example Cafe Menu (Chưa có menu)-->
        <style>
            *{
                box-sizing: border-box;
                margin: 0 auto;
            }

            #container {
                border: 1px solid orange;
            }

            #header1{
                width: 100%;
                height: 200px;
                background-color: aqua;
                text-align: center;
                line-height: 200px;
                color: rgb(165, 99, 42);
                font-style: italic;
                text-transform: uppercase;
                letter-spacing: 3px;
                font-size: 30px;
                text-shadow: 5px 5px 5px rgb(255, 170, 0);
            }

            #menu{
                width: 100%;
                height: 50px;
                background-color: blueviolet;
                border-bottom: 1px solid rgb(255, 0, 0);
                border-top: 1px solid rgb(255, 0, 0);
            }

            #content{
                width: 100%;
                height: 550px;
                background-color: aqua;
                
            }

            #h2{
                color: brown;
                background-color: antiquewhite;
            }

            #menu ul{
                display: inline-block;
                line-height: 50px;
                list-style: none;
            }

            #menu ul li{
                margin: 5px;
            }

            #menungang{
                width: 100%;
                height: 50px;
                background-color: pink;
            }

            #menudoc{
                width: 20%;
                height: 550px;
                background-color: gray;
                float: left;
            }

            #content1{
                width: 50%;
                height: 550px;
                float: left;
                background-color: green;
            }

            #content2{
                width: 30%;
                height: 550px;
                float: left;
                background-color: yellowgreen;
            }

            #menudoc ul{
                text-align: center;
            }

            #menudoc ul li{
                list-style: none;
                margin-top: 1px;
                background-color: palevioletred;
                border-radius: 20%;
            }
        </style>
        
    </head>

    <!-- Phần thân -->
    <body> <!-- Thể hiện mọi thứ trong trang web đều ở trong body -->
        <div id="container"> <!-- Dùng để quản lý các thẻ con -->
            <!-- div 1 (Header 1)-->
            <div id="header1">
                <h1> Cafe menu </h1>
            </div>

            <!-- Menu ngang-->
            <div id="menungang">
                <p> Đây là menu ngang </p>
            </div>

            <!-- Menu dọc -->
            <div id="menudoc">
                <p> Đây là menu dọc </p>
                <ul>
                    <li> Nội dung 1 </li>
                    <li> Nội dung 2 </li>

                </ul>
            </div>

            <!-- Content1-->
            <div id="content1">
                <p> Đây là nội dung 1</p>
            </div>

            <!-- Content2 -->
            <div id="content2">
                <p> Đây là nội dung 2 </p>
            </div>

            <div id="footer">

            </div>
        </div>
    </body>
</html>
