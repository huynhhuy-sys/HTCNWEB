<!DOCTYPE html>
<html lang="en">
    <!-- Phần mở đầu -->
    <head>
        <title> ContacUs </title>
    </head>

    <!-- Phần thân -->
    <body>
        <fieldset>
            <legend> Your message </legend>
            <table>
                <!-- Hàng 1 -->
                <tr>  
                    <td style="width: 80px ;"> To </td>
                    <td> <input type="text" name="to" value="examplecafe"> </td>
                </tr>

                <!-- Hàng 2 -->
                <tr>
                    <td> Your email </td>
                    <td> <input type="text" name="to"> </td>
                </tr>

                <!-- Hàng 3 -->
                <tr>
                    <td> Message </td>
                    <td> 
                        <textarea rows="10" cols="50"> </textarea>
                    </td>
                </tr>

                <!-- Hàng 4 -->
                <tr>
                    <td> Attach File </td>
                    <td> 
                        <input type="submit" value="Choose File">
                        No file chosen
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend> How you found us: </legend>
            <table>
                <!-- Hàng 1-->
                <tr>
                    <td> How did you hear of us </td>
                    <td> 
                        <select name="google"> 
                            <option value="1"> Google </option>
                        </select>
                    </td>
                </tr>

                <!-- Hàng 2 -->
                <tr>
                    <td> Newsletter </td>
                    <td> <input type="checkbox" name="st"> Ensure this box is checked if you would like to receive email updats </td>
                </tr>
            </table>
        </fieldset>
        <input type="submit" value="Send message">
    </body>
</html>
